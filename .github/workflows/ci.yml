name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: porter
          POSTGRES_PASSWORD: porter
          POSTGRES_DB: porter
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U porter -d porter"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: start mockapp
        run: |
          nohup python -m uvicorn mockapp.main:app --port 9200 > mockapp.log 2>&1 &
          sh scripts/wait_for.sh http://localhost:9200/healthz 60
      - name: pytest
        env:
          MOCKAPP_URL: http://localhost:9200
          DATABASE_URL: postgresql://porter:porter@localhost:5432/porter
        run: python -m pytest -q
      - name: mockapp logs
        if: always()
        run: cat mockapp.log
