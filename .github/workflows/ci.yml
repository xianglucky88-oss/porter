name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: start mockapp
        run: |
          nohup python -m uvicorn mockapp.main:app --port 9200 > mockapp.log 2>&1 &
          sh scripts/wait_for.sh http://localhost:9200/healthz 60
      - name: pytest
        env:
          MOCKAPP_URL: http://localhost:9200
        run: python -m pytest -q
      - name: mockapp logs
        if: always()
        run: cat mockapp.log
