services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: porter
      POSTGRES_PASSWORD: porter
      POSTGRES_DB: porter
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U porter -d porter"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  mockapp:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    command: ["uvicorn", "mockapp.main:app", "--host", "0.0.0.0", "--port", "9200"]
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:9200/healthz', timeout=3).status==200 else 1)"]
      interval: 2s
      timeout: 4s
      retries: 20
      start_period: 5s

  runner:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "9201"]
    environment:
      DATABASE_URL: postgresql://porter:porter@db:5432/porter
      MOCKAPP_URL: http://mockapp:9200
      USE_BROWSER: "0"
      HEADLESS: "1"
    ports: ["9201:9201"]
    depends_on:
      db:
        condition: service_healthy
      mockapp:
        condition: service_healthy
    volumes:
      - ./flows:/app/flows:ro

volumes:
  pgdata:
