name: reimbursement_batch
description: 差旅费用报销批量录入（每人每月一次）
dataset: reimbursement

steps:
  - kind: open
    value: /form/reimbursement

  - kind: fill
    field: source_key
    value: EXP-{date}-0042

  - kind: fill
    field: applicant
    value: 李娜

  - kind: fill
    field: expense_type
    value: 差旅费

  - kind: fill
    field: amount_cents
    value: "348600"

  - kind: fill
    field: invoice_no
    value: INV-20261108-7781

  - kind: fill
    field: remark
    value: 华东区客户拜访

  - kind: submit
    value: ""

  - kind: assert_text
    selector: p#receipt-id
    value: ""
